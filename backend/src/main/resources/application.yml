# ============================================================================
# 云枢智学 · 后端主配置（公共项）
# 环境差异与密钥放在 application-dev.yml / application-prod.yml 及环境变量中。
# 依据：docs/design/02.整体架构设计.md §2.4、§2.5，docs/design/04.API接口设计.md §2
# ============================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: yunshu-zhixue
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    # 存储统一 UTC，接口展示按 Asia/Shanghai（database-rules §3.5）
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yunshu.zhixue.modules
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    portal:
      # 学员端令牌域（密钥在 profile 中提供）
      access-token-ttl: 2h
      refresh-token-ttl: 14d
      issuer: yunshu-zhixue-portal
    admin:
      # 管理端令牌域（密钥在 profile 中提供，与学员端完全独立）
      access-token-ttl: 2h
      refresh-token-ttl: 14d
      issuer: yunshu-zhixue-admin
  storage:
    bucket: ${MINIO_BUCKET:yszx-files}
    # Nginx 将 /files 反向代理至 MinIO 桶（D20）
    public-base-path: /files
  ai:
    # OpenAI 兼容协议；base-url/api-key/model 由 profile + 环境变量提供
    connect-timeout: 5s
    read-timeout: 30s
    grading-timeout: 10s
    max-retries: 2
  # 后台用户重置密码的默认密码，部署期可改（Q9，不落库）
  default-password: ${APP_DEFAULT_PASSWORD:Yszx@123456}

logging:
  level:
    root: INFO
    com.yunshu.zhixue: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
