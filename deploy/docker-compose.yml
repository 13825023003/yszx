# ============================================================================
# 云枢智学 · 基础设施编排（MySQL 8.0 + Redis 7 + MinIO）
#
# 依据：docs/design/02.整体架构设计.md §2.4 部署拓扑、§4.6 deploy 目录
#   - 数据库：MySQL 8.0，库名 yszx，utf8mb4 / utf8mb4_0900_ai_ci，UTC 时区
#   - 缓存：Redis 7.x（登录态、验证码、配额、限流计数）
#   - 对象存储：MinIO（S3 兼容协议），头像/Logo 等图片
#
# 快速开始（在 deploy 目录下）：
#   Copy-Item env\.env.example .env    # 首次使用：生成环境变量文件
#   docker compose up -d               # 一键启动
#
# 约定：
#   - 密码等敏感信息只存在于 deploy/.env（从 env/.env.example 复制），不进本文件；
#   - 首次启动且 mysql-data 卷为空时，自动执行 ../scripts/sql/schema.sql 建库建表；
#   - 容器网络内用服务名访问（mysql:3306 / redis:6379 / minio:9000），
#     宿主机访问用 localhost + 下面映射的端口。
# ============================================================================

name: yszx

services:
  # --------------------------------------------------------------------------
  # MySQL 8.0 —— 业务主库
  # 字符集、排序规则、时区与 scripts/sql/schema.sql 保持一致（database-rules §3.5）
  # --------------------------------------------------------------------------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: yszx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请先复制 deploy/env/.env.example 为 deploy/.env，并填写 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-yszx}"
      MYSQL_USER: "${MYSQL_USER:-yszx}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?请先在 deploy/.env 中填写 MYSQL_PASSWORD}"
      TZ: UTC
    # 服务端统一 UTF-8 与时区：UTC 存储，展示层按 Asia/Shanghai 转换
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空时自动执行一次；后续表结构变更需手动执行迁移脚本
      - ../scripts/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - yszx-net

  # --------------------------------------------------------------------------
  # Redis 7 —— 登录态、验证码、AI 面试配额、限流计数
  # 数据不可随意淘汰（登录态与配额丢失会影响业务），使用 AOF 持久化
  # --------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis:7.2-alpine}
    container_name: yszx-redis
    restart: unless-stopped
    environment:
      TZ: UTC
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请先在 deploy/.env 中填写 REDIS_PASSWORD}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - yszx-net

  # --------------------------------------------------------------------------
  # MinIO —— 对象存储（S3 兼容），控制台 9001
  #
  # 镜像说明（2026-11 实测）：MinIO 官方已不再公开发布社区版镜像，
  # minio/minio、minio/mc（Docker Hub / quay.io）均无法拉取，dl.min.io 返回 410。
  # 这里改用 Bitnami 维护的冻结镜像 bitnamilegacy/minio（内含 MinIO 2025.5.24 +
  # mc），S3 API 与端口行为不变；数据目录为 /bitnami/minio/data（非 root 用户）。
  # 国内网络可在 .env 中把镜像地址换成镜像站前缀，例如
  # docker.m.daocloud.io/bitnamilegacy/minio:latest。
  # --------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    container_name: yszx-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请先在 deploy/.env 中填写 MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请先在 deploy/.env 中填写 MINIO_ROOT_PASSWORD（至少 8 位）}"
      # Bitnami 默认关闭内置 Web 控制台（9001），本地开发打开便于查看桶与对象
      MINIO_BROWSER: "${MINIO_BROWSER:-on}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"  # S3 API，后端 SDK 连接使用
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web 控制台
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - yszx-net

  # --------------------------------------------------------------------------
  # 一次性初始化任务：创建业务桶并开放匿名只读
  # 依据 04.API接口设计.md：/files/** 为 MinIO 直链，头像、Logo 需公开可读。
  # 若后续要求私有读（预签名 URL），删除 anonymous set download 一行即可。
  # --------------------------------------------------------------------------
  minio-init:
    image: ${MC_IMAGE:-bitnamilegacy/minio-client:latest}
    container_name: yszx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # 用 MC_HOST_<alias> 直接注入凭据，避免非 root 用户写 HOME 下的 mc 配置
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000"
      MC_CONFIG_DIR: /tmp/.mc
      HOME: /tmp
      MINIO_BUCKET: "${MINIO_BUCKET:-yszx-files}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set download "local/$${MINIO_BUCKET}" &&
        echo "MinIO bucket $${MINIO_BUCKET} is ready"
    restart: "no"
    networks:
      - yszx-net

volumes:
  mysql-data:
    name: yszx-mysql-data
  redis-data:
    name: yszx-redis-data
  minio-data:
    name: yszx-minio-data

networks:
  yszx-net:
    name: yszx-net
