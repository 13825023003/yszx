<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 云枢智学</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
</head>
<body>

<div class="auth-wrap">
  <aside class="auth-side">
    <div class="inner">
      <a class="logo" href="index.html"><span class="logo-mark">云</span><span>云枢智学</span></a>
      <h2>三步开启<br>你的 AI 学习之路</h2>
      <p class="sub">注册只需要 1 分钟。完成后我们会引导你选择技术方向，并为你准备一份专属的入门练习。</p>

      <div class="steps-v" style="margin-top:34px;max-width:340px">
        <div class="step active">
          <span class="dotv">1</span>
          <div><div class="st">创建账号</div><div class="sd">手机号 + 验证码，快速完成</div></div>
        </div>
        <div class="step">
          <span class="dotv">2</span>
          <div><div class="st">完善信息</div><div class="sd">设置昵称、选择技术方向</div></div>
        </div>
        <div class="step">
          <span class="dotv">3</span>
          <div><div class="st">开始训练</div><div class="sd">刷题练习 → AI 面试检验</div></div>
        </div>
      </div>

      <div class="auth-foot">© 2026 云枢智学 · 原型演示环境，数据均为模拟数据</div>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-topbar">已有账号？<a href="login.html">直接登录</a></div>
    <div class="auth-box">
      <h1 class="auth-title">创建你的账号</h1>
      <p class="auth-sub">注册即可免费使用全部题库与 AI 面试功能</p>

      <form class="form-stack" id="regForm" novalidate>
        <div class="field" id="f-phone">
          <label>手机号</label>
          <div class="input-icon">
            <span class="i">📱</span>
            <input class="input" id="phone" placeholder="请输入 11 位手机号" maxlength="11" inputmode="numeric" />
          </div>
          <div class="err-text">请输入正确的 11 位手机号</div>
        </div>

        <div class="field" id="f-code">
          <label>验证码</label>
          <div class="otp-row">
            <input class="input" id="code" placeholder="请输入 6 位验证码" maxlength="6" inputmode="numeric" />
            <button class="btn btn-outline" type="button" id="sendCode">获取验证码</button>
          </div>
          <div class="err-text">请输入 6 位验证码</div>
        </div>

        <div class="field" id="f-pwd">
          <label>设置密码</label>
          <div class="input-icon">
            <span class="i">🔒</span>
            <input class="input" id="pwd" type="password" placeholder="6-20 位，建议包含大小写与数字" maxlength="20" style="padding-right:44px" />
            <button type="button" id="togglePwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted-2)">👁</button>
          </div>
          <div class="pwd-meter" id="pwdMeter">
            <i></i><i></i><i></i><span>—</span>
          </div>
          <div class="err-text">密码长度需为 6-20 位</div>
        </div>

        <div class="field" id="f-pwd2">
          <label>确认密码</label>
          <div class="input-icon">
            <span class="i">🔐</span>
            <input class="input" id="pwd2" type="password" placeholder="请再次输入密码" maxlength="20" />
          </div>
          <div class="err-text">两次输入的密码不一致</div>
        </div>

        <div class="field" id="f-agree">
          <label class="checkbox agree">
            <input type="checkbox" id="agree">
            <span>我已阅读并同意 <a href="javascript:void(0)" data-doc="用户协议">《用户协议》</a> 和 <a href="javascript:void(0)" data-doc="隐私政策">《隐私政策》</a></span>
          </label>
          <div class="err-text">请先阅读并同意用户协议与隐私政策</div>
        </div>

        <button class="btn btn-primary btn-block" style="height:46px;margin-top:4px" type="submit">注 册</button>
      </form>

      <div class="foot-note">已有账号？<a href="login.html">立即登录</a></div>
    </div>
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  function setField(id, ok) { document.getElementById(id).classList.toggle('invalid', !ok); return ok; }
  const pwd = document.getElementById('pwd');
  const meter = document.getElementById('pwdMeter');

  document.querySelectorAll('[data-doc]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); UI.toast(`《${a.dataset.doc}》为原型占位，暂未提供全文`, 'info');
  }));
  document.getElementById('togglePwd').addEventListener('click', e => {
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
    e.currentTarget.textContent = pwd.type === 'password' ? '👁' : '🙈';
  });

  /* 密码强度 */
  pwd.addEventListener('input', () => {
    const v = pwd.value;
    meter.className = 'pwd-meter';
    if (!v) { meter.querySelector('span').textContent = '—'; return; }
    let score = 0;
    if (v.length >= 6) score++;
    if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
    if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
    if (v.length >= 12 && score === 3) score = 3;
    score = Math.max(1, score);
    meter.classList.add('lv' + score);
    meter.querySelector('span').textContent = ['', '弱', '中', '强'][score];
  });

  /* 验证码倒计时 */
  let cd = 0, timer = null;
  const sendBtn = document.getElementById('sendCode');
  function tick() {
    if (cd <= 0) { clearInterval(timer); sendBtn.disabled = false; sendBtn.textContent = '获取验证码'; return; }
    sendBtn.textContent = `${cd}s 后重发`; cd--;
  }
  sendBtn.addEventListener('click', () => {
    const phone = document.getElementById('phone').value.trim();
    if (!setField('f-phone', /^1\d{10}$/.test(phone))) return;
    const daily = UI.Store.get('code_daily_' + phone, 0);
    if (daily >= 10) { UI.toast('今日获取次数已达上限', 'warn'); return; }
    UI.Store.set('code_daily_' + phone, daily + 1);
    cd = 60; sendBtn.disabled = true;
    clearInterval(timer); timer = setInterval(tick, 1000); tick();
    UI.toast('验证码已发送（演示环境：任意 6 位数字均可）', 'success');
  });

  /* 提交 */
  document.getElementById('regForm').addEventListener('submit', e => {
    e.preventDefault();
    const phone = document.getElementById('phone').value.trim();
    const code = document.getElementById('code').value.trim();
    const p1 = pwd.value, p2 = document.getElementById('pwd2').value;
    const agree = document.getElementById('agree').checked;

    const okPhone = setField('f-phone', /^1\d{10}$/.test(phone));
    const okCode = setField('f-code', /^\d{6}$/.test(code));
    const okPwd = setField('f-pwd', p1.length >= 6 && p1.length <= 20);
    const okPwd2 = setField('f-pwd2', p1.length >= 6 && p1 === p2);
    const okAgree = setField('f-agree', agree);
    if (!(okPhone && okCode && okPwd && okPwd2 && okAgree)) {
      if (!okAgree) UI.toast('请先阅读并同意用户协议与隐私政策', 'warn');
      return;
    }
    UI.Store.set('logged_out', false);
    UI.Store.set('user', {
      name: '新学员' + phone.slice(-4), phone: phone, email: '', gender: 'secret',
      role: 'student', isAdmin: false, joined: new Date().toLocaleDateString('zh-CN'),
      days: 0, questions: 0, interviews: 0, accuracy: 0, streak: 0, isNew: true
    });
    UI.toast('注册成功，正在进入个人中心完善资料', 'success');
    setTimeout(() => location.href = 'profile.html?welcome=1', 700);
  });
})();
</script>
</body>
</html>
